format = """
[](#4C72B0)\
$username\
[](bg:#5A9BD4 fg:#4C72B0)\
$directory\
[](bg:#2E3440 fg:#5A9BD4)\
$git_branch\
$git_status\
[](fg:#2E3440)\
$character
"""

right_format = """
[](#3A86FF)\
$env_var\
[](#3A86FF)
"""

[username]
show_always = true
style_user = "bg:#4C72B0 fg:white"
format = "[$user]($style)"

[directory]
style = "bg:#5A9BD4 fg:white"
format = "[ $path ]($style)"
truncation_length = 2
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bg:#2E3440 fg:#88C0D0"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:#2E3440 fg:#EBCB8B"
format = "[ $all_status$ahead_behind ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[env_var.PS_ENV]
variable = "PS_ENV"
style = "bg:#3A86FF fg:white"
format = "[ $env_value ]($style)"
